// Launcher layer's Gradle settings, applied from the end of build.gradle.kts (see LAUNCHER_RULES.md).
// Nuvio One's build.gradle.kts keeps its own values; this script overrides what the launcher changes,
// so a Nuvio One update to build.gradle.kts rarely conflicts with us.
//
// This is a Groovy script on purpose: a Kotlin script applied with apply(from = ...) cannot see the Android Gradle
// plugin's classes (no ApplicationExtension import, no type-safe `android` accessor), while Groovy reaches the
// `android` and `androidComponents` extensions dynamically.

// Where the in-app updater looks for new releases (-PlivetvUpdateRepo=<owner/repo> still overrides).
def launcherUpdateRepo = (project.findProperty("livetvUpdateRepo") as String)?.trim()
if (!launcherUpdateRepo) launcherUpdateRepo = "Br0ck25/NuvioTVLauncher"
def slash = launcherUpdateRepo.indexOf('/')
def launcherOwner = slash >= 0 ? launcherUpdateRepo.substring(0, slash) : ""
def launcherRepoName = slash >= 0 ? launcherUpdateRepo.substring(slash + 1) : ""
android.defaultConfig.buildConfigField("String", "GITHUB_OWNER", "\"${launcherOwner}\"".toString())
android.defaultConfig.buildConfigField("String", "GITHUB_REPO", "\"${launcherRepoName}\"".toString())

// App ids. These run after build.gradle.kts's own onVariants callbacks, so the last set() wins.
androidComponents.onVariants(androidComponents.selector().withBuildType("debug")) { variant ->
    def isPlaystore = variant.productFlavors.any { it.second == "playstore" }
    // -PlivetvDebugAppId=<id> installs a debug build next to another copy (own data, own icon).
    def debugAppId = (project.findProperty("livetvDebugAppId") as String)?.trim() ?: "com.nuvio.tv.launcher"
    variant.applicationId.set(isPlaystore ? "com.nuvio.appdebug" : debugAppId)
}
androidComponents.onVariants(androidComponents.selector().withBuildType("release")) { variant ->
    def isPlaystore = variant.productFlavors.any { it.second == "playstore" }
    // Test builds (-PlivetvTestBuild=true) get their own ID, so they install next to the real app.
    def testBuild = (project.findProperty("livetvTestBuild") as String)?.toBoolean() == true
    if (!isPlaystore) variant.applicationId.set(testBuild ? "com.nuvio.tv.launcher.test" : "com.nuvio.tv.launcher")
}

// The official Nuvio account server and its publishable (public by design) client key, used when a build
// doesn't set its own NUVIO_SUPABASE_URL / NUVIO_SUPABASE_ANON_KEY, so signing in with a real Nuvio account
// works without any extra setup. Same lookup order as build.gradle.kts: debug reads local.dev.properties then
// local.properties; release reads the environment, then local.properties.
def launcherDefaultSupabaseUrl = "https://api.nuvio.tv"
def launcherDefaultSupabaseAnonKey = "sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN"
def launcherProps = { String fileName ->
    def props = new Properties()
    def file = rootProject.file(fileName)
    if (file.exists()) file.withInputStream { props.load(it) }
    props
}
def launcherLocalProps = launcherProps("local.properties")
def launcherDevProps = launcherProps("local.dev.properties")
// The first non-blank value among the sources (each a closure from a key to a value), else the fallback.
def launcherSupabase = { String key, String fallback, List sources ->
    for (source in sources) {
        def value = source(key)?.toString()?.trim()
        if (value) return value
    }
    fallback
}
def debugSources = [{ k -> launcherDevProps.getProperty(k) }, { k -> launcherLocalProps.getProperty(k) }]
def releaseSources = [{ k -> System.getenv(k) }, { k -> launcherLocalProps.getProperty(k) }]
def debugType = android.buildTypes.getByName("debug")
debugType.buildConfigField("String", "SUPABASE_URL", "\"${launcherSupabase("NUVIO_SUPABASE_URL", launcherDefaultSupabaseUrl, debugSources)}\"".toString())
debugType.buildConfigField("String", "SUPABASE_ANON_KEY", "\"${launcherSupabase("NUVIO_SUPABASE_ANON_KEY", launcherDefaultSupabaseAnonKey, debugSources)}\"".toString())
def releaseType = android.buildTypes.getByName("release")
releaseType.buildConfigField("String", "SUPABASE_URL", "\"${launcherSupabase("NUVIO_SUPABASE_URL", launcherDefaultSupabaseUrl, releaseSources)}\"".toString())
releaseType.buildConfigField("String", "SUPABASE_ANON_KEY", "\"${launcherSupabase("NUVIO_SUPABASE_ANON_KEY", launcherDefaultSupabaseAnonKey, releaseSources)}\"".toString())

// On-device ADB client used by the phone-driven Home button setup (runs the commands on this TV).
dependencies.add("fullImplementation", "com.github.MuntashirAkon:libadb-android:3.0.0")
// libadb-android only exposes BouncyCastle at runtime; used to create the ADB identity cert.
dependencies.add("fullImplementation", "org.bouncycastle:bcprov-jdk15to18:1.78")
dependencies.add("testImplementation", "org.robolectric:robolectric:4.17")
// Icon pack tests parse appfilter.xml; Android's XmlPullParser is not on the JVM test classpath.
dependencies.add("testImplementation", "net.sf.kxml:kxml2:2.3.0")

// Nuvio One's SMB library (jcifs-ng) pulls org.bouncycastle:bcprov-jdk18on:1.76, the same classes as the
// bcprov-jdk15to18:1.78 above. Two copies fail the duplicate-class check, so the full flavor keeps the newer one.
// (The playstore flavor has no launcher libraries and keeps jcifs-ng's own copy.)
configurations.matching { it.name.startsWith("full") }.configureEach {
    exclude(group: "org.bouncycastle", module: "bcprov-jdk18on")
}

// Our manifest entries (HOME / ALL_APPS filters, services, boot receiver, app queries) live in
// src/launcher/AndroidManifest.xml. It is merged for every build type, because a source set takes one manifest.
android.buildTypes.configureEach { buildType ->
    android.sourceSets.maybeCreate(buildType.name).manifest.srcFile("src/launcher/AndroidManifest.xml")
}
