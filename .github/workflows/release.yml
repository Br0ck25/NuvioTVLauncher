name: Release

# Builds the signed release APKs and publishes them as a GitHub release. The app's built-in updater
# (Settings -> About) reads this repo's releases, so everyone who has the app is offered the new version.
#
# Run it from the Actions tab: pick the branch to release, type the version (it must be higher than the
# last release, e.g. 1.0.1), and say what changed. See README -> "Releasing" for the secrets it needs.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.0.0 (higher than the last release)"
        required: true
        type: string
      notes:
        description: "What changed (shown in the update prompt)"
        required: false
        type: string
      allow_different_key:
        description: "Allow a signing key that is not the one 1.1.x used (users could not update in place; they would have to reinstall)"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as a pre-release (only the Beta update channel offers it)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version and the signing key
        env:
          VERSION: ${{ inputs.version }}
          KEYSTORE: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 || secrets.LAUNCHER_KEYSTORE_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Version must look like 1.0.0 (or 1.0.0-beta.1), not '$VERSION'." >&2; exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "A release named $VERSION already exists. Use a higher version." >&2; exit 1
          fi
          if [ -z "$KEYSTORE" ]; then
            echo "The LAUNCHER_KEYSTORE_BASE64 secret is missing: a release must be signed with your own key." >&2
            echo "Add it (and LAUNCHER_KEY_ALIAS, LAUNCHER_KEY_PASSWORD, LAUNCHER_STORE_PASSWORD) under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The app's keys. Starts from the LOCAL_PROPERTIES_BASE64 secret (a base64 copy of local.properties:
      # the Nuvio sign-in server and the other service keys), then any individual secret below replaces
      # the same key. Anything not set anywhere is left out, and that feature stays off.
      - name: Write app keys
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
          NUVIO_BACKEND_URL: ${{ secrets.NUVIO_BACKEND_URL }}
          NUVIO_BACKEND_KEY: ${{ secrets.NUVIO_BACKEND_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
        run: |
          : > local.properties
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties; fi
          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            cp local.properties local.dev.properties
          fi
          # Machine-specific lines from someone's own computer must not leak into the build.
          for f in local.properties local.dev.properties; do
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_[A-Z_]+)[[:space:]]*=/d' "$f"
          done
          set_prop() {
            [ -n "$2" ] || return 0
            for f in local.properties local.dev.properties; do
              sed -i -E "/^[[:space:]]*$1[[:space:]]*=/d" "$f"
              printf '\n%s=%s\n' "$1" "$2" >> "$f"
            done
          }
          if [ -n "$NUVIO_BACKEND_URL" ]; then
            BACKEND="${NUVIO_BACKEND_URL%/}"
            set_prop NUVIO_SUPABASE_URL "$BACKEND"
            set_prop NUVIO_SUPABASE_ANON_KEY "$NUVIO_BACKEND_KEY"
            case "$BACKEND" in
              *api.nuvio.tv*) ;;
              *)
                set_prop TV_LOGIN_WEB_BASE_URL "$BACKEND/tv-login"
                set_prop DEVICE_LOGIN_WEB_BASE_URL "$BACKEND/link"
                set_prop AVATAR_PUBLIC_BASE_URL "$BACKEND/storage/v1/object/public/avatars"
                ;;
            esac
          fi
          set_prop TMDB_API_KEY "$TMDB_API_KEY"
          set_prop TRAKT_CLIENT_ID "$TRAKT_CLIENT_ID"
          set_prop TRAKT_CLIENT_SECRET "$TRAKT_CLIENT_SECRET"
          set_prop SIMKL_CLIENT_ID "$SIMKL_CLIENT_ID"
          set_prop SIMKL_APP_NAME "$SIMKL_APP_NAME"
          set_prop MDBLIST_CLIENT_ID "$MDBLIST_CLIENT_ID"
          set_prop GOOGLE_DRIVE_CLIENT_ID "$GOOGLE_DRIVE_CLIENT_ID"
          set_prop GOOGLE_DRIVE_CLIENT_SECRET "$GOOGLE_DRIVE_CLIENT_SECRET"
          set_prop PREMIUMIZE_CLIENT_ID "$PREMIUMIZE_CLIENT_ID"
          set_prop IMDB_RATINGS_API_BASE_URL "$IMDB_RATINGS_API_BASE_URL"
          set_prop IMDB_TAPFRAME_API_BASE_URL "$IMDB_TAPFRAME_API_BASE_URL"
          set_prop INTRODB_API_URL "$INTRODB_API_URL"
          # Names only, never values.
          echo "Keys set:"; sed -E 's/[[:space:]]*=.*//' local.properties | grep -v '^[[:space:]]*$' | sort -u

      - name: Signing
        # Uses the NUVIO_RELEASE_* key (the one the 1.1.x releases were signed with) when it is set,
        # otherwise the LAUNCHER_* key. The build is checked against 1.1.x's certificate below.
        env:
          KEYSTORE: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 || secrets.LAUNCHER_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 && secrets.NUVIO_RELEASE_KEY_ALIAS || secrets.LAUNCHER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 && secrets.NUVIO_RELEASE_KEY_PASSWORD || secrets.LAUNCHER_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 && secrets.NUVIO_RELEASE_STORE_PASSWORD || secrets.LAUNCHER_STORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build the release APKs
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:assembleFullRelease --stacktrace \
            -PlivetvBuildNumber=${{ github.run_number }} \
            -PlivetvVersionName=${{ inputs.version }}

      # Users on 1.1.x can only update in place if this APK is signed with the same key.
      - name: Check the signing certificate matches 1.1.x
        env:
          EXPECTED: 9a9d096552dcb8ee8a7e27d0632ef4888fbd6b6ec34774f9ec0cb5ccbd2138b5
          ALLOW: ${{ inputs.allow_different_key }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk=$(find app/build/outputs/apk/full/release -name "*universal*.apk" | head -1)
          got=$("$APKSIGNER" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "Signing certificate SHA-256: $got"
          if [ "$got" != "$EXPECTED" ]; then
            if [ "$ALLOW" = "true" ]; then
              echo "::warning::Signed with a different key than 1.1.x: users cannot update in place."
            else
              echo "This APK is not signed with the key 1.1.x used, so those users could not update in place." >&2
              echo "Add the original key as the NUVIO_RELEASE_* secrets, or re-run with 'allow_different_key' ticked." >&2
              exit 1
            fi
          fi

      # The built-in VPN includes OpenVPN 2 (GPL): its corresponding source is published with each release.
      - name: Package OpenVPN 2 corresponding source
        run: python3 vpn-android/ci/package-openvpn2-sources.py --output out/openvpn2-corresponding-source.tar.gz

      - name: Collect the APKs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p out
          # Keep the plain names (app-full-universal-release.apk, ...): the Downloader link
          # (releases/latest/download/app-full-universal-release.apk) and the in-app updater rely on them.
          for f in $(find app/build/outputs/apk/full/release -name "*.apk"); do
            cp "$f" "out/$(basename "$f")"
          done
          ls -la out

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Nuvio Launcher ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            out/*.apk
            out/openvpn2-corresponding-source.tar.gz
          body: |
            Nuvio Launcher ${{ inputs.version }}.

            ${{ inputs.notes }}
