name: Build APK

# Builds a debug APK on every push to this branch (GitHub only lists "Run workflow" buttons for workflows
# that exist on the default branch, so this one starts itself instead). It needs no secrets: the APK is
# attached to the run as a download (Artifacts, at the bottom of the run page).
on:
  push:
    branches: [claude/bold-goldberg-w50bnp, claude/list-channels, claude/home-rows-release-parity, sync/nuvio-original]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The app's keys. Starts from the LOCAL_PROPERTIES_BASE64 secret (a base64 copy of local.properties:
      # the Nuvio sign-in server and the other service keys), then any individual secret below replaces
      # the same key. Anything not set anywhere is left out, and that feature stays off.
      - name: Write app keys
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
          NUVIO_BACKEND_URL: ${{ secrets.NUVIO_BACKEND_URL }}
          NUVIO_BACKEND_KEY: ${{ secrets.NUVIO_BACKEND_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
        run: |
          : > local.properties
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties; fi
          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            cp local.properties local.dev.properties
          fi
          # Machine-specific lines from someone's own computer must not leak into the build.
          for f in local.properties local.dev.properties; do
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_[A-Z_]+)[[:space:]]*=/d' "$f"
          done
          set_prop() {
            [ -n "$2" ] || return 0
            for f in local.properties local.dev.properties; do
              sed -i -E "/^[[:space:]]*$1[[:space:]]*=/d" "$f"
              printf '\n%s=%s\n' "$1" "$2" >> "$f"
            done
          }
          if [ -n "$NUVIO_BACKEND_URL" ]; then
            BACKEND="${NUVIO_BACKEND_URL%/}"
            set_prop NUVIO_SUPABASE_URL "$BACKEND"
            set_prop NUVIO_SUPABASE_ANON_KEY "$NUVIO_BACKEND_KEY"
            case "$BACKEND" in
              *api.nuvio.tv*) ;;
              *)
                set_prop TV_LOGIN_WEB_BASE_URL "$BACKEND/tv-login"
                set_prop DEVICE_LOGIN_WEB_BASE_URL "$BACKEND/link"
                set_prop AVATAR_PUBLIC_BASE_URL "$BACKEND/storage/v1/object/public/avatars"
                ;;
            esac
          fi
          set_prop TMDB_API_KEY "$TMDB_API_KEY"
          set_prop TRAKT_CLIENT_ID "$TRAKT_CLIENT_ID"
          set_prop TRAKT_CLIENT_SECRET "$TRAKT_CLIENT_SECRET"
          set_prop SIMKL_CLIENT_ID "$SIMKL_CLIENT_ID"
          set_prop SIMKL_APP_NAME "$SIMKL_APP_NAME"
          set_prop MDBLIST_CLIENT_ID "$MDBLIST_CLIENT_ID"
          set_prop GOOGLE_DRIVE_CLIENT_ID "$GOOGLE_DRIVE_CLIENT_ID"
          set_prop GOOGLE_DRIVE_CLIENT_SECRET "$GOOGLE_DRIVE_CLIENT_SECRET"
          set_prop PREMIUMIZE_CLIENT_ID "$PREMIUMIZE_CLIENT_ID"
          set_prop IMDB_RATINGS_API_BASE_URL "$IMDB_RATINGS_API_BASE_URL"
          set_prop IMDB_TAPFRAME_API_BASE_URL "$IMDB_TAPFRAME_API_BASE_URL"
          set_prop INTRODB_API_URL "$INTRODB_API_URL"
          # Names only, never values.
          echo "Keys set:"; sed -E 's/[[:space:]]*=.*//' local.properties | grep -v '^[[:space:]]*$' | sort -u

      # The debug build is signed with the repo's "release" signing config, which needs a keystore file.
      # This uses the fork's committed key (store/key password "livetvfork", alias "livetv"), so every
      # build is signed the same way and can update the previous install. To use your own private key
      # instead, add a secret named LIVETV_KEYSTORE_BASE64 (same alias and passwords).
      - name: Signing
        env:
          LIVETV_KEYSTORE_BASE64: ${{ secrets.LIVETV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LIVETV_KEYSTORE_BASE64" ]; then
            printf '%s' "$LIVETV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/key.jks"
          else
            cp keystore/livetv-fork.jks "$RUNNER_TEMP/key.jks"
          fi
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/key.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=livetv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=livetvfork"
            echo "NUVIO_RELEASE_STORE_PASSWORD=livetvfork"
          } >> "$GITHUB_ENV"

      - name: Build the debug APK
        run: ./gradlew --console=plain :app:assembleFullDebug --parallel --build-cache

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
