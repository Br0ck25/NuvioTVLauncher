name: Build APK

# Run it by hand from the Actions tab (Run workflow, with your branch selected). It needs no secrets:
# it builds a debug APK and attaches it to the run as a download (Artifacts, at the bottom of the run page).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build the debug APK
        run: ./gradlew --console=plain :app:assembleFullDebug --parallel --build-cache

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
