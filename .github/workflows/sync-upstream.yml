name: Sync upstream Nuvio TV

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge NuvioMedia/NuvioTV dev into dev
    runs-on: ubuntu-latest
    if: github.repository != 'NuvioMedia/NuvioTV'
    steps:
      - name: Check out dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge upstream dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/NuvioMedia/NuvioTV.git
          git fetch upstream dev

          behind="$(git rev-list --count HEAD..upstream/dev)"
          if [[ "${behind}" == "0" ]]; then
            echo "Already up to date with upstream."
            exit 0
          fi

          echo "Merging ${behind} upstream commit(s)."
          if ! git merge upstream/dev --no-edit -m "Merge upstream NuvioMedia/NuvioTV dev"; then
            conflicted="$(git diff --name-only --diff-filter=U)"
            echo "Conflicted files:"; echo "${conflicted}"

            if [[ "${conflicted}" == "app/build.gradle.kts" ]]; then
              # Known recurring conflict (fork versionCode/versionName). Keep the fork's side.
              echo "Auto-resolving app/build.gradle.kts, keeping fork side of conflict blocks."
              git diff app/build.gradle.kts
              python3 - <<'PY'
          import re
          p = "app/build.gradle.kts"
          s = open(p).read()
          s = re.sub(r"<<<<<<< [^\n]*\n(.*?)=======\n.*?>>>>>>> [^\n]*\n", r"\1", s, flags=re.S)
          open(p, "w").write(s)
          PY
              if grep -qE '^(<<<<<<<|=======|>>>>>>>)' app/build.gradle.kts; then
                echo "Conflict markers remain; falling back to PR." >&2
                git merge --abort
                open_pr=1
              else
                git add app/build.gradle.kts
                git commit --no-edit
              fi
            else
              git merge --abort
              open_pr=1
            fi

            if [[ "${open_pr:-0}" == "1" ]]; then
              # Push upstream tip to a branch and open a PR so conflicts can be resolved in the UI.
              git push --force origin upstream/dev:refs/heads/sync/upstream
              if [[ -z "$(gh pr list --head sync/upstream --base dev --state open --json number --jq '.[0].number')" ]]; then
                gh pr create --base dev --head sync/upstream \
                  --title "Sync upstream NuvioMedia/NuvioTV dev (needs conflict resolution)" \
                  --body "Automatic sync could not merge cleanly. Conflicted files:
          ${conflicted}"
              fi
              echo "Opened/updated sync PR; manual resolution required." >&2
              exit 1
            fi
          fi
          git push origin HEAD:dev
